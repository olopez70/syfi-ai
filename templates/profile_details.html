<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profiles - SyFi AI Database Browser</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/shared_navigation_styles.css') }}">
</head>
<body class="bg-light">
    {% include 'shared_navigation.html' %}

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                        <h4 class="mb-0">
                            <i class="fas fa-user-tag me-2"></i>Profile Details
                        </h4>
                    </div>
                    
                    <!-- Tab Navigation -->
                    <div class="card-body p-0">
                        <ul class="nav nav-tabs nav-fill" id="profileTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="search-profiles-tab" data-bs-toggle="tab" data-bs-target="#search-profiles" type="button" role="tab">
                                    <i class="fas fa-search me-2"></i>Search Profiles
                                </button>
                            </li>
                        </ul>
                        
                        <!-- Tab Content -->
                        <div class="tab-content" id="profileTabsContent">
                            
                            <!-- Search Profiles Tab -->
                            <div class="tab-pane fade show active" id="search-profiles" role="tabpanel">
                                <div class="p-4">
                                    
                                    <!-- Search Form -->
                                    <form id="profile-search-form" class="mb-4">
                                        <div class="row g-3">
                                            <div class="col-md-3">
                                                <label for="profile-search" class="form-label">Search Profiles</label>
                                                <input type="text" class="form-control" id="profile-search" name="search" placeholder="Profile name, description...">
                                            </div>
                                            <div class="col-md-3">
                                                <label for="profile-id-filter" class="form-label">Profile ID</label>
                                                <input type="text" class="form-control" id="profile-id-filter" name="profile_id" placeholder="Enter Profile ID">
                                            </div>
                                            <div class="col-md-3">
                                                <label for="template-filter" class="form-label">Template</label>
                                                <select class="form-select" id="template-filter" name="template_id">
                                                    <option value="">All Templates</option>
                                                </select>
                                            </div>
                                            <div class="col-md-3">
                                                <label class="form-label">&nbsp;</label>
                                                <button type="submit" class="btn btn-primary w-100">
                                                    <i class="fas fa-search me-1"></i>Search
                                                </button>
                                            </div>
                                        </div>
                                    </form>
                                    
                                    <!-- Loading Indicator -->
                                    <div id="profile-loading" class="text-center py-3" style="display: none;">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">Loading...</span>
                                        </div>
                                    </div>
                                    
                                    <!-- Results Container -->
                                    <div id="profile-results" style="display: none;">
                                        <div class="d-flex justify-content-between align-items-center mb-3">
                                            <h5 class="mb-0">Profile Results</h5>
                                            <span id="profile-count" class="badge bg-primary">0</span>
                                        </div>
                                        <div class="table-responsive">
                                            <table class="table table-hover">
                                                <thead class="table-light">
                                                    <tr>
                                                        <th>Profile Name & ID</th>
                                                        <th>Template</th>
                                                        <th>Created</th>
                                                        <th>Actions</th>
                                                    </tr>
                                                </thead>
                                                <tbody id="profile-results-body">
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>
                                    
                                    <!-- No Results -->
                                    <div id="profile-no-results" class="text-center py-5" style="display: none;">
                                        <i class="fas fa-search fa-3x text-muted mb-3"></i>
                                        <h5 class="text-muted">No profiles found</h5>
                                        <p class="text-muted">Try adjusting your search criteria or create new profiles from templates.</p>
                                        <a href="/profiles" class="btn btn-outline-primary">
                                            <i class="fas fa-id-card me-1"></i>Browse Profile Templates
                                        </a>
                                    </div>
                                    
                                </div>
                            </div>
                            
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/shared_navigation.js') }}"></script>
    <script src="{{ url_for('static', filename='js/profile_details.js') }}"></script>
</body>
</html>
