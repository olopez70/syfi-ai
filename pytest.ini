[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --cov=src
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=80
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnknownMarkWarning
    ignore:'imghdr' is deprecated and slated for removal in Python 3.13:DeprecationWarning:visions
markers =
    unit: Unit tests for individual functions and classes
    integration: Integration tests for component interactions  
    web: Web interface and API endpoint tests
    performance: Performance and benchmark tests
    domain: Banking domain and business rule tests
    slow: Slow-running tests (may be skipped in quick runs)
    benchmark: Benchmark tests using pytest-benchmark
    banking: Banking-specific business logic tests